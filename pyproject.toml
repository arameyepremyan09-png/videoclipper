[project]
name = "videoclipper"
version = "0.1.0"
description = "Materialagnostische Short-Form-Clipping-Pipeline"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.1",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Nur nötig, wenn kein YouTube-Transkript vorliegt.
asr = ["faster-whisper>=1.1.0"]
# Auf Apple Silicon deutlich schneller als faster-whisper auf CPU.
asr-mac = ["mlx-whisper>=0.4.0"]

[project.scripts]
clip = "videoclipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoclipper"]

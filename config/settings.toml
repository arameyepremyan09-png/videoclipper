# Gemeinsame Einstellungen. Wandert mit dem Repo auf jede Maschine.
# Maschinenspezifisches gehört in config/local.toml (nicht im Repo).

[output]
width = 1080
height = 1920
fps = 30
target_lufs = -14.0

[monetarisierung]
# TikTok Creator Rewards verlangt *über* eine Minute, nicht exakt 60 s.
# Encoder runden auf Frame-Grenzen, deshalb Sicherheitsabstand.
# Programmbedingungen ändern sich — dieser Wert ist bewusst Konfiguration.
tier_a_min_sekunden = 63.0
tier_a_ziel_min = 65.0
tier_a_ziel_max = 85.0

[ingest]
# yt-dlp wählt sonst AV1. Die RX 580 hat dafür kein Hardware-Decode.
# Auf Apple Silicon unkritisch, aber einheitlich zu halten ist einfacher.
format_selector = "bv[vcodec^=avc1][height<=1080]+ba/b[height<=1080]"
# --download-sections brauchte über 7 Minuten für 2 Sekunden. Nie benutzen.
download_sections = false
max_retries = 5

[transkript]
# YouTube de-orig im json3-Format hat Wort-Offsets, Satzzeichen und
# [gelächter]-Marker. Primärquelle; eigene ASR nur als Fallback.
quelle = "youtube"
youtube_sub_lang = "de-orig"
asr_fallback = "whisper"
whisper_model = "large-v3-turbo"

[selektion]
kandidaten_pro_video = 25
min_score = 0.45

[soundtrack]
# Auftrag des Nutzers vom 2026-10-20: JEDES Video bekommt einen Soundtrack,
# aus seinem eigenen Ordner. Die Dateien wandern NICHT mit dem Repo — sie sind
# fremde Aufnahmen und gehoeren zur Maschine, nicht zum Code. Nur der Pfad
# steht hier.
#
# BEWUSST KEINE VIERTE PLATTFORMSTELLE: `~` loest auf beiden Rechnern auf, der
# Ausdruck ist also auf Windows und macOS derselbe. Liegt der Ordner woanders,
# gehoert der abweichende Pfad nach config/local.toml — wie jede andere
# maschinenspezifische Abweichung.
ordner = "~/Desktop/Soundtracks"
# Fehlt der Ordner oder ist er leer, bricht der Renderlauf ab statt still ohne
# Musik zu rendern: Ein Clip ohne Soundtrack sieht im QC aus wie ein fertiger,
# genau wie ein Clip ohne Pflicht-Overlays (siehe CLAUDE.md, qc.pflichtelemente).
pflicht = true

# ---------------------------------------------------------------------------
# Plattformabhängig. Genau drei Stellen — mehr darf es nicht werden.
# ---------------------------------------------------------------------------

[platform.win32]
work_dir = "F:/videoclipper"        # C: hat nur ~80 GB frei
encoder = "libx264"                 # kein NVENC; h264_amf nur für Previews
preview_encoder = "libx264"
hwaccel = "d3d11va"
asr_backend = "cpu"

[platform.darwin]
work_dir = "~/videoclipper"         # 256 GB intern: nur für Einzelvideos
encoder = "h264_videotoolbox"
preview_encoder = "h264_videotoolbox"
hwaccel = "videotoolbox"
asr_backend = "mlx"                 # Neural Engine, deutlich schneller

[veroeffentlichen]
# Auftrag des Nutzers vom 2026-10-21: YouTube-Shorts stuendlich ab 10 Uhr,
# nicht alle auf einmal. `clip veroeffentliche` fuellt das Raster ab..bis und
# springt danach auf den naechsten Tag; Termine anderer Laeufe bleiben frei.
zeitzone = "Europe/Berlin"
ab = "10:00"
bis = "22:00"
abstand_minuten = 60
# YouTube verlangt einen Termin in der Zukunft — Puffer fuer Upload und Verarbeitung.
vorlauf_minuten = 15

[beobachten]
# Auftrag des Nutzers vom 2026-10-21: die Kanaele aus config/kanaele.yaml auf
# Abruf pruefen (`werkzeuge/neue-clips`, kein Dauerdienst) und neue Videos
# sofort clippen. YouTube vollautomatisch und oeffentlich geplant (Weg A),
# TikTok nur als Mitteilung (Weg B). Ablauf in beobachten.py.
# Kuerzer ist ein Short oder ein Trailer, laenger dauert die ASR zu lange.
min_dauer_s = 300
max_dauer_s = 14400
# 0 = fehlt de-orig noch, sofort selbst transkribieren statt zu warten.
warte_auf_untertitel_h = 0.0
# Ein Livestream, der so lange nicht als fertiges Video vorliegt, wird aufgegeben.
aufgeben_nach_h = 48.0
# Je Video fuenf Clips und ein Top 5 aus denselben Momenten (Auftrag 2026-10-21).
clips_pro_video = 5
top5 = true
# Sechs Uploads je Video, das Raster hat 13 Termine am Tag. Liegt der naechste
# freie Termin weiter weg, wird das Video uebersprungen statt veraltet gepostet.
max_vorlauf_tage = 4
min_frei_gb = 40
# Der Agent (claude -p): Zeitlimit je Video, Versuche, Modell (leer = Standard).
agent_timeout_min = 240
agent_versuche = 2
modell = ""
asr_modell = "~/videoclipper/models/ggml-large-v3-turbo-q5_0.bin"

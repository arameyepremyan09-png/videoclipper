# Materialprofil: Coachlim / Couch-Runde
#
# Gemessen am 2026-09-05 an 4ubrGJLb4FQ ("ILLEGALE ANMACHSPRUECHE MEINER
# ZUSCHAUER", mit Rohat und Asleyia), 882 Messpunkte im Abstand von 2 s.
#
# ANDERER MATERIALTYP als COACHLIM_OMETV_SPLIT: kein Browser-Capture, keine
# Boxen. Eine feststehende Kamera auf drei Personen nebeneinander. Die
# Kantenmessung findet folgerichtig keine einzige starke statische Kante —
# das Maximum liegt bei 13.3, gegen 177.1 im Splitscreen-Material. Es gibt
# hier schlicht nichts zu trennen.
#
# Die drei Personen liegen zwischen x=80 und x=1800, also ueber praktisch die
# volle Breite. Ein 9:16-Beschnitt um irgendein Zentrum verliert zwei von
# ihnen. Genau deshalb laeuft das Template auf voller Breite; siehe COUCH_FULL.

name: COACHLIM_COUCH
beschreibung: Feststehende Vollbildkamera auf drei Personen, Overlays am Rand
gueltig_ab: 2026-09-05

quelle:
  breite: 1920
  hoehe: 1080
  kanaele: [Coachlim]
  sprache: de

# Erkannt wird nicht das Layout, sondern der Bildausschnitt: Der eingeblendete
# Piraten-Zaehler oben links steht in der weiten Einstellung immer und faellt
# im nachtraeglich hineingezoomten Schnitt aus dem Bild. Gemessen ueber das
# ganze Video ist das exakt zweigipflig — 39..51 mit Zaehler, 0.2..4.3 ohne,
# und dazwischen kein einziger Messwert. Die Schwelle liegt in der Luecke.
signatur:
  modus: COUCH
  kante_y: 13
  bereich: [40, 440]
  schwelle: 25.0

modi:
  COUCH:
    zonen:
      couch: { box: [0, 0, 1920, 1080], rolle: creator, fokus_x: 960 }
    muellzonen:
      # Alle drei liegen im Bild und lassen sich nicht wegschneiden, ohne
      # Personen zu verlieren. Sie stehen hier als Hinweis fuer die Selektion.
      - { box: [0, 0, 460, 40], hinweis: Piraten-Zaehler oben links }
      - { box: [1560, 0, 360, 200], hinweis: Twitch-Chat oben rechts }
      - { box: [1700, 1000, 220, 80], hinweis: Instant-Gaming-Logo unten rechts }

datenschutz:
  fremdinhalt_blur: false

signale:
  # NULL Marker im Transkript dieses Videos — kein [gelächter], nichts. Derselbe
  # Befund wie bei LnWKgVfcMMQ. Der Lacher-Detektor muss hier vollstaendig aus
  # der Lautheit kommen, deshalb steht lachmarker auf 0 und loudness_peak hoch.
  lachmarker: 0.0
  loudness_peak: 1.0
  sprechtempo: 0.6

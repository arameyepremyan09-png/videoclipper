# Template: TOP5_HALLOFCLIPS
#
# Top-5-Countdown im Stil der Referenzen, die der Nutzer am 2026-09-16
# geliefert hat (HallOfClips: uYAMGga5wr0, c2UMW2I1lZ8, R8HNyeyCsWE, bis
# 1,28 Mio. Views). Alle drei sind pixelgleich aufgebaut und weichen in fast
# jedem Mass von TOP5_COUNTDOWN ab, das an @phrai92 vermessen ist — deshalb
# ein eigenes Template statt einer Aenderung dort. Messwerte und Werkzeug:
# CLAUDE.md, Nachtrag 2026-09-16 im Abschnitt TOP5_COUNTDOWN.
#
# WAS GEMESSEN IST und was angenaehert:
# - Videofeld, Headlinefarbe, Ziffernlage, Zeilenabstand: gemessen, exakt.
# - Schrift: Die Referenz nutzt eine breitere, kursive Schrift. Hier Anton mit
#   ``neigung`` (Scherung), weil Anton die einzige Schrift im Repo ist. Die
#   Groessen sind so gewaehlt, dass Ziffern- und Versalhoehe den Referenzen
#   entsprechen; die Zeilen werden dadurch schmaler als dort.
#
# UMGEBAUT AM 2026-10-20 AUF ANSAGE DES NUTZERS: "Bei den TOP 5 Videos muss
# das eigentliche Video viel groesser sein und der Text kleiner, man muss das
# Video sehen."
#
# Das hebelt die Vermessung der Referenzen an genau zwei Stellen aus, und
# zwar absichtlich — SCHNITTREGELN.md steht ueber jeder Messung. Was vorher
# hier stand und warum es fuer die Referenzen richtig war:
#
#   Videofeld   [86, 900, 908, 908]   quadratisch, gemessen an allen dreien
#   Headline    62 px auf y=312
#   Liste       50 px ab y=480, Abstand 86.25
#
# DER GRUND, WARUM ES FUER EIGENES MATERIAL NICHT TAUGT: Die Referenzmomente
# sind quadratisch geschnitten und fuellen ihr Feld ganz. Eine 16:9-Quelle
# steht in 908x908 nur als 908x511 — 464000 Pixel Bild, der Rest Blur. Beim
# ersten eigenen Countdown (frankreich_top5) war genau das der Befund.
#
# JETZT: volle Breite, unbeschnitten. 1080x608 sind 657000 Pixel, 41 % mehr
# als vorher, und das Feld ist exakt so hoch wie das Bild — innerhalb des
# Panels bleibt kein Blurbalken. Mehr geht ohne Beschneiden nicht: 1080x608
# ist die groesste unverzerrte Flaeche, die ein 16:9-Bild auf 1080 Breite
# einnehmen kann. Wer mehr will, muss seitlich beschneiden und verliert bei
# Gespraechsformaten die Leute am Rand (Regel 2, Fall 2).
#
# Das Videofeld endet jetzt bei y=1520 und liegt damit ERSTMALS ganz ueber
# TikToks UI-Zone (ab 1728). Die Meldung von ``sicherheitszone_pruefen``
# faellt deshalb weg — bei den Referenzen lief das Feld bis 1808 hinein.

name: TOP5_HALLOFCLIPS
beschreibung: Top-5-Countdown, Videofeld auf voller Breite, kleine Liste mit Emojis
gilt_fuer_modus: COMPILATION

canvas: [1080, 1920]

panels:
  # ``einpassen`` statt ``fuellen``: Eine 16:9-Quelle fuellt dieses Feld exakt,
  # es entsteht kein Blurbalken. Ein quadratisch geschnittener Moment aus
  # ``top5_referenz.py`` (908x908) bekommt hier dagegen Balken links und
  # rechts — fuer uebernommene Referenzmomente ist das alte Feld das richtige.
  - quelle: segment
    # Volle Breite, 16:9, mittig im freien Raum unter der Liste (endet 540)
    # und ueber der UI-Zone (ab 1728): 540 + (1728-540-608)/2 = 830.
    ziel: [0, 830, 1080, 608]
    passung: einpassen

hintergrund:
  modus: blur
  staerke: 24

headline:
  statisch: true
  quelle: countdown.titel
  schrift: Anton
  # 44 statt der an der Referenz gemessenen 62: "der Text kleiner" (Nutzer,
  # 2026-10-20). ``zeilen_faktor`` bleibt, das Verhaeltnis stimmt weiter.
  schriftgroesse: 44
  zeilen_faktor: 1.47
  versalien: true
  farbe: "#FAC102"          # Median aus ~35000 Pixeln, alle drei Shorts gleich
  rand_farbe: "#000000"
  rand_staerke: 6
  neigung: 0.18
  y: 150
  # Breiter als die Referenz (700): Bei 44 px passt mehr in eine Zeile, und
  # zwei kurze Zeilen stehen ruhiger als zwei fast leere.
  max_breite: 920
  max_zeilen: 2
  renderer: png_overlay

liste:
  plaetze: 5
  # Die Referenzwerte waren 480 / 86.25 / 160 bei 50 px Schrift. Hier alles
  # kleiner und weiter oben, damit unter der Liste Platz fuer das Videofeld
  # bleibt: fuenf Zeilen ab 300 im Abstand von 60 enden bei 540.
  erste_zeile_y: 300
  zeilenabstand: 60.0
  ziffer_x: 205             # mittiger als die Referenz, weil die Zeilen kuerzer sind
  text_x: 540               # Beschriftung + Emojis als Gruppe mittig
  schrift: Anton
  schriftgroesse: 34
  versalien: false
  farbe: "#FFFFFF"
  rand_farbe: "#000000"
  rand_staerke: 5
  max_breite: 700           # bei 34 px reicht das fuer rund 30 Zeichen plus Emoji
  emoji_faktor: 1.3         # Totenkopf 70 px gegen 43 px Ziffernhoehe
  renderer: png_overlay

sicherheitszone:
  unten: 192

# --- Pflicht-Overlays ------------------------------------------------------

untertitel:
  aktiv: false
  grund: >-
    Segmente kommen aus mehreren Quellen, deren Transkripte der CountdownPlan
    nicht mitfuehrt; Textkanal ist die Liste. Die drei HallOfClips-Referenzen
    haben ebenfalls keine Untertitel (bis 1,28 Mio. Views).

follow_hinweis:
  # Links unten IM Videofeld (830..1438), nicht mittig: Beim ersten Render von
  # abugoku_top5 lag der Knopf mittig bei 23.7 s auf dem Kopf von Coach, der
  # sich gerade vor Lachen kruemmte — auf der Pointe von Platz 4. Am
  # gerenderten Frame je Plan nachsehen, das ist materialabhaengig.
  x: 200
  y: 1270

audio:
  normalisieren: true
  ziel_lufs: -14.0

# Template: OME_SPLIT
#
# Fremde Cam oben, Creator-Cam unten. Die Reihenfolge ist nicht neu erfunden:
# Sie steht schon in OME_STACK, dort aus den Referenz-Shorts (NextGenClips)
# gemessen. Der Aufbau laeuft in der fremden Box, die Pointe in der Reaktion.
#
# WARUM NICHT OME_STACK: Dessen Panels sind 909 px hoch und summieren zu 1818
# statt 1920. Stage 09 lehnt das heute ab — zu Recht, denn vstack braucht eine
# lueckenlose Buehne, und ungerade Hoehen rundet der Scaler in yuv420p still ab.
# OME_STACK stammt aus der Zeit vor dieser Pruefung. Hier stehen zwei exakt
# gleiche Haelften zu je 960 px; die Naht liegt damit auf der Bildmitte.

name: OME_SPLIT
beschreibung: Fremde Cam oben, Creator-Cam unten, je zur Haelfte, Headline auf der Naht
default_fuer: [COACHLIM_OMETV_SPLIT]
gilt_fuer_modus: OMETV

canvas: [1080, 1920]

panels:
  - quelle: fremden_cam
    ziel: [0, 0, 1080, 960]
    passung: einpassen
  - quelle: creator_cam
    ziel: [0, 960, 1080, 960]
    passung: einpassen

# Quelle 952x798 auf 1080x960: der Massstab kommt aus der Breite (1.134), die
# Hoehe landet bei 904. Es bleiben je 28 px oben und unten, die den Blur der
# eigenen Quelle tragen. Beschnitten wird nichts — die Cams sind der Inhalt.
hintergrund:
  modus: blur
  staerke: 24

headline:
  statisch: true
  quelle: editplan.headline
  schrift: Anton
  schriftgroesse: 64
  versalien: true
  farbe: "#FFFFFF"
  rand_farbe: "#000000"
  rand_staerke: 9
  y: 960
  max_breite: 1000
  max_zeilen: 2
  renderer: png_overlay

# Overlay-Lagen — gemessen am 2026-09-07 an acht gerenderten Clips
#
# Die Standardwerte aus config/overlays.yaml setzen die Untertitel auf
# 1424..1688. Das ist bei diesem Template genau die Zone, in der die Gesichter
# der Creator-Cam stehen: Stuhlkante ab y=1378, Haaransatz ab 1391, Gesichter
# bis rund 1660. Der Text lag also mitten im Gesicht.
#
# Frei ist nur das Wandband oberhalb der Koepfe. Ueber vier Clips vermessen
# ist 1030..1378 durchgehend Wand, Poster und Klimageraet — kein Gesicht.
# Nach oben begrenzt die Headline: Ihre Testformel gibt 1031, gemessen reicht
# die zweizeilige Fassung bis 1032.
#
#   1031  Unterkante Headline (zweizeilig gemessen)
#   1050  Follow-Pille oben      (94 px hoch)
#   1144  Follow-Pille unten
#   1155  Untertitelband oben    (200 px statt 264, zwei Zeilen brauchen 142)
#   1355  Untertitelband unten
#   1378  Stuhlkante — ab hier beginnt das Bild der Personen
#
# Die Reihenfolge Headline -> Pille -> Band ist die Zusage aus
# tests/test_overlays.py und bleibt erhalten; die Pille rutscht mit nach oben,
# weil sie sonst unter dem Band laege.
#
# Der Twitch-Chat der Creator-Cam liegt rechts im selben Band. Er ist kleiner,
# halbtransparenter Lauftext, der Untertitel hat 8 px schwarzen Rand — das
# traegt. Ihn zu umgehen hiesse, den Text aus der Mitte zu ruecken.

untertitel:
  y: 1255
  band_hoehe: 200

follow_hinweis:
  y: 1097
  # KLEINER ALS ueberall sonst, und das ist gemessen, nicht Geschmack: Frei ist
  # bei diesem Template nur das Wandband zwischen Headline (endet 1031) und
  # Untertitelband (beginnt 1155) — 124 px. Der Standardknopf braucht 150 px
  # Kantenmass und passt dort nicht. 64 px Durchmesser ergeben 92 px, also
  # 1051..1143, und lassen oben wie unten Luft.
  #
  # Die Alternative waere gewesen, den Knopf woanders hinzulegen. Es gibt kein
  # Woanders: Ober- und unterhalb dieses Bandes stehen Gesichter, und genau
  # deshalb liegt hier ueberhaupt etwas.
  durchmesser: 64

branding: { aktiv: false, text: "TODO", y: 1790 }
audio:    { normalisieren: true, ziel_lufs: -14.0 }

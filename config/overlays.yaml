# Pflicht-Overlays — gelten fuer JEDEN Clip.
#
# WARUM HIER UND NICHT IM TEMPLATE: Leitprinzip 3 sagt, nur zwei Schichten
# duerfen materialabhaengig sein — Materialprofil (Geometrie der Quelle) und
# Template (Zielkomposition). Untertitel und Follow-Aufforderung sind weder
# das eine noch das andere: Sie sind eine Hausregel und in jedem Clip gleich.
# In elf Templates kopiert waeren sie elf Stellen, die auseinanderlaufen.
#
# Templates duerfen einzelne Werte ueberschreiben (``layout.template`` mischt
# diese Datei als Unterlage darunter, gleiches Muster wie
# settings.toml/local.toml). Abschalten geht nur mit ``grund`` — siehe
# ``qc.pflichtelemente``.

version: 1
stand: 2026-09-06

# ---------------------------------------------------------------------------
# Sicherheitszone
# ---------------------------------------------------------------------------
#
# TikTok verdeckt die unteren ~192 px mit Caption, Buttons und Soundzeile.
# Gemessen an @phrai92/7673568784648539424 (siehe TOP5_COUNTDOWN). Beide
# Overlays unten muessen darueber bleiben, sonst stehen sie hinter der UI.

sicherheitszone:
  unten: 192

# ---------------------------------------------------------------------------
# Untertitel — Pflicht 1
# ---------------------------------------------------------------------------
#
# ANIMATION MIT WENIG AUFWAND, woertlich gemeint:
#
# Der FFmpeg-Build auf dem MacBook hat weder libass noch drawtext. Karaoke
# waere hier also nicht nur teuer, sondern gar nicht baubar — und es ist
# ausserdem nicht der gemessene Hausstil (siehe CLAUDE.md, Abschnitt "Look").
#
# Gebaut wird deshalb wie die Countdown-Liste: ein PNG je Cue, eingeblendet
# ueber ``enable='between(t,ab,bis)'``. Die Animation ist ein Aufwaertsruck
# beim Cue-Wechsel und steckt komplett im ``y``-Ausdruck des overlay-Filters.
# Kosten: null zusaetzliche Bilder, null zusaetzliche Filter. Genau das ist
# der "wenig Aufwand".
#
# Die Bandbreite (nicht die volle Canvashoehe) haelt den Speicher klein:
# 1080x264 statt 1080x1920 ist pro Cue ein Achtel.

untertitel:
  aktiv: true

  # --- Satz ---
  schrift: Anton
  schriftgroesse: 62
  versalien: true
  farbe: "#FFFFFF"
  rand_farbe: "#000000"
  rand_staerke: 8
  max_breite: 960
  max_zeilen: 2

  # --- Lage ---
  # y ist die Mitte des Bandes, gleiche Bedeutung wie bei ``headline.y``.
  # 1556 +- 132 ergibt 1424..1688, also 40 px Luft bis zur UI-Zone bei 1728.
  y: 1556
  band_hoehe: 264

  # --- Schnitt der Cues ---
  # Ein Cue bricht, sobald eine der drei Grenzen reisst. Die Werte sind
  # gewaehlt, nicht gemessen: zwei lesbare Zeilen bei 62 px sind rund 42
  # Zeichen, und ueber ~2 s hat ein Zuschauer den Text laengst gelesen.
  satzende: true       # ein Punkt bricht die Zeile, nicht erst max_zeichen
  max_zeichen: 42
  max_dauer: 2.2
  pause: 0.45          # Sprechpause, die einen Umbruch erzwingt
  min_dauer: 0.6       # kuerzer blitzt der Text nur auf
  max_halten: 0.9      # so lange steht ein Cue nach dem letzten Wort noch

  animation:
    art: aufwaerts     # einziger Wert; alles andere braucht mehr als einen Filter
    dauer: 0.14        # Einschwingzeit
    hub: 26            # px, aus denen der Cue nach oben faehrt

  renderer: png_overlay

# ---------------------------------------------------------------------------
# Follow-Aufforderung — Pflicht 2
# ---------------------------------------------------------------------------
#
# WARUM MITTEN IM CLIP UND NICHT AM ENDE: Die eigenen Zahlen sagen, dass die
# Zuschauer nicht bis zum Ende bleiben (scoring.yaml gewichtet Retention mit
# 0.40, und ``completion_rate`` ist die Groesse, die dort fehlt). Eine
# Aufforderung am Abspann erreicht nur die, die ohnehin geblieben sind.
# Gesetzt wird sie deshalb nach dem Hook und vor der Pointe.
#
# ``konversion`` ist mit 0.20 die drittstaerkste Achse des Scores und laut
# scoring.yaml "das Ziel des Accounts" — Follows pro View. Dieses Overlay ist
# die einzige Stelle der Pipeline, die direkt darauf einzahlt.
#
# WAS SEIT DEM 2026-09-08 IM BILD STEHT: der runde Folgen-Knopf der App. Ein
# Mauszeiger faehrt von rechts unten herein — dort liegt auf TikTok die
# Buttonleiste —, drueckt den roten Knopf, und der wird mit einem verpuffenden
# Ring weiss und traegt einen Haken. Danach faehrt der Zeiger wieder hinaus und
# der Knopf poppt weg.
#
# Bewegung steckt weiterhin in den x/y-Ausdruecken und kostet nichts. Groesse
# und Zustand koennen das nicht: ``scale`` laesst sich nicht ueber die Zeit
# ausdruecken. Pop, Druck und Wegpoppen sind deshalb eine Folge kurz
# geschalteter Standbilder — dasselbe Verfahren wie die Countdown-Liste.
# Siehe follow.py, Abschnitt "Die Szene".

follow_hinweis:
  aktiv: true

  # Nur noch Protokoll: Im Bild steht seit dem 2026-09-08 kein Text mehr,
  # sondern der runde Knopf. Der Wortlaut bleibt, damit im EditPlan nachlesbar
  # ist, welche Aufforderung gemeint war.
  text: "FOLGEN"

  # --- Der Knopf ---
  # Durchmesser des Kreises in Ruhe. TikToks eigener Folgen-Knopf misst auf
  # 1080 px Breite rund 50 px; das ist als alleinstehendes Overlay zu klein,
  # 112 px liest sich auf dem Handy noch als Knopf und nicht als Punkt.
  durchmesser: 112
  farbe_vorher: "#FE2C55"     # das Rot der App
  farbe_nachher: "#FFFFFF"
  zeichen_vorher: "#FFFFFF"   # Plus
  zeichen_nachher: "#12121A"  # Haken
  rand_farbe: "#000000"
  rand_staerke: 6
  ring_farbe: "#FFFFFF"       # der Ring, der beim Klick nach aussen verpufft

  # y ist die Mitte des Knopfes.
  y: 1290

  cursor:
    hoehe: 104
    farbe: "#FFFFFF"
    rand_farbe: "#000000"
    # Wo die Spitze auf dem Knopf landet: leicht rechts unter der Mitte, so
    # wie ein Mensch zielt — genau auf die Mitte sieht nach Rasterung aus.
    ziel_dx: 14
    ziel_dy: 16
    # Wie weit unterhalb des Knopfes er das Bild betritt. Waagerecht kommt er
    # immer von rechts: Dort liegt auf TikTok die Buttonleiste.
    start_dy: 520

  # --- Zeitfenster ---
  # ab_anteil ist der Anteil der Cliplaenge, an dem sie erscheint; die
  # Schranken davor und danach gewinnen, wenn der Clip kurz ist.
  ab_anteil: 0.35
  dauer: 3.0
  min_dauer: 1.8             # darunter wird nicht gestaucht, sondern gemeldet
  nicht_vor: 3.0             # der Hook gehoert dem Clip
  nicht_nach_ende: 2.0       # die Pointe auch

  renderer: png_overlay
